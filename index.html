<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="money-bg-decor" aria-hidden="true">
    <div class="floating-money m1">✦</div>
    <div class="floating-money m2">✧</div>
    <div class="floating-money m3">✦</div>
    <div class="floating-money m4">✶</div>
    <div class="floating-money m5">✧</div>
    <div class="floating-money m6">✦</div>
    <div class="floating-money m7">✶</div>
    <div class="floating-money m8">✧</div>
  </div>

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div class="brand-text">
          <h1>Money Control</h1>
          <span class="brand-tagline">Savings &amp; deposits</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="updated-at" id="updatedAt">Loading…</span>
        <button class="refresh-btn" id="refreshBtn" title="Refresh now">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="summary-cards">
      <div class="card total-card">
        <div class="card-label">Total Savings</div>
        <div class="card-value" id="totalSavings">—</div>
        <div class="card-sub" id="totalSub">Loading…</div>
      </div>
      <div class="card">
        <div class="card-label" id="moneySavedLabel">Money Saved</div>
        <div class="card-value green" id="moneySaved">—</div>
        <div class="card-sub" id="moneySavedCount">—</div>
      </div>
      <div class="card">
        <div class="card-label" id="depositsSavedLabel">Deposits Saved</div>
        <div class="card-value secondary" id="depositsSaved">—</div>
        <div class="card-sub" id="depositsCount">—</div>
      </div>
      <div class="card">
        <div class="card-label">Deposits Interest</div>
        <div class="card-value payout" id="depositInterest">—</div>
        <div class="card-sub" id="depositInterestSub">Deposits · monthly</div>
      </div>
      <div class="card">
        <div class="card-label">Savings Interest</div>
        <div class="card-value payout" id="savingsInterest">—</div>
        <div class="card-sub" id="savingsInterestSub">Savings · quarterly</div>
      </div>
    </section>

    <section class="card goal-card">
      <div class="goal-top">
        <div>
          <div class="card-label">FD Goal</div>
          <div class="goal-target-line">
            <span>Target</span>
            <span class="goal-currency">₹</span>
            <input id="goalInput" class="goal-input" type="number" min="0" step="1000" value="10000000" aria-label="FD goal target amount" />
          </div>
        </div>
        <div class="goal-percent" id="goalPercent">0%</div>
      </div>
      <div class="goal-bar"><div class="goal-fill" id="goalFill"></div></div>
      <div class="goal-meta">
        <div>
          <span class="goal-meta-label">FD amount</span>
          <strong id="goalSaved">—</strong>
        </div>
        <div>
          <span class="goal-meta-label">Remaining to save</span>
          <strong id="goalRemaining" class="goal-pending">—</strong>
        </div>
      </div>
    </section>

    <section class="layout">
      <div class="card chart-card">
        <h2>Breakdown</h2>
        <div class="donut-wrap">
          <canvas id="donutChart" width="240" height="240"></canvas>
        </div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="tables-stack" id="sections"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
